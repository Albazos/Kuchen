name: Build Standalone Releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install PySide6 pyinstaller

      - name: Build Standalone
        run: python build_release.py --standalone

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/KuchenApp_standalone_*.zip
